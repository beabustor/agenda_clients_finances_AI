<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc"><title id="title">Drive del usuario</title><desc id="desc">Ejemplo conceptual con datos ficticios. Integraciones pendientes.</desc><rect width="1120" height="740" rx="24" fill="#f4f7f5"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#193c32}.muted{fill:#60766a}.green{fill:#216b50}</style><text x="32" y="38" font-size="12" font-weight="750" class="green">MI OFICINA / ASÍ FUNCIONARÁ</text><rect x="874" y="18" width="210" height="29" rx="14" fill="#e7f3eb" stroke="#e7f3eb"/><text x="886" y="38" font-size="11" font-weight="650" class="green">DISEÑO PREVISTO · NO CONECTADO</text><text x="32" y="88" font-size="28" font-weight="750" class="">Todo conectado. Cada documento, una sola vez.</text><text x="32" y="118" font-size="15" font-weight="400" class="muted">Carpetas de Drive + libro con filtros + IDs estables. Datos ficticios.</text><rect x="28" y="145" width="470" height="518" rx="14" fill="#ffffff" stroke="#dae5de"/><text x="50" y="180" font-size="18" font-weight="700" class="">Mi unidad / Mi oficina</text><path d="M50 204h15l5 5h22v25h-42z" fill="#e7f3eb" stroke="#216b50" stroke-width="1.5"/><text x="106" y="220" font-size="16" font-weight="650" class="">Clientes</text><text x="106" y="242" font-size="12" font-weight="400" class="muted">Una carpeta por cliente</text><path d="M82 264h15l5 5h22v25h-42z" fill="#e7f3eb" stroke="#216b50" stroke-width="1.5"/><text x="138" y="280" font-size="16" font-weight="650" class="">CLI-0001 · Laura</text><text x="138" y="302" font-size="12" font-weight="400" class="muted">Accesos directos a sus documentos</text><path d="M50 330h15l5 5h22v25h-42z" fill="#e7f3eb" stroke="#216b50" stroke-width="1.5"/><text x="106" y="346" font-size="16" font-weight="650" class="">Contabilidad / 2026</text><text x="106" y="368" font-size="12" font-weight="400" class="muted">Libro de gestión · Google Sheets</text><path d="M82 398h15l5 5h22v25h-42z" fill="#e7f3eb" stroke="#216b50" stroke-width="1.5"/><text x="138" y="414" font-size="16" font-weight="650" class="">Facturas emitidas</text><path d="M82 445h15l5 5h22v25h-42z" fill="#e7f3eb" stroke="#216b50" stroke-width="1.5"/><text x="138" y="461" font-size="16" font-weight="650" class="">Gastos y facturas recibidas</text><path d="M82 492h15l5 5h22v25h-42z" fill="#e7f3eb" stroke="#216b50" stroke-width="1.5"/><text x="138" y="508" font-size="16" font-weight="650" class="">Justificantes y exportaciones</text><path d="M50 558h15l5 5h22v25h-42z" fill="#e7f3eb" stroke="#216b50" stroke-width="1.5"/><text x="106" y="574" font-size="16" font-weight="650" class="">Administración / Actividad diaria</text><text x="106" y="596" font-size="12" font-weight="400" class="muted">Solo fecha, categoría y cantidad</text><rect x="524" y="145" width="568" height="260" rx="14" fill="#ffffff" stroke="#dae5de"/><text x="546" y="182" font-size="21" font-weight="700" class="">Libro de gestión 2026</text><text x="546" y="210" font-size="13" font-weight="400" class="muted">Filtros ▾   Clientes | Citas | Facturas | Documentos</text><rect x="542" y="230" width="532" height="34" rx="4" fill="#e7f3eb" stroke="#e7f3eb"/><text x="552" y="252" font-size="12" font-weight="700" class="green">factura_id</text><text x="686" y="252" font-size="12" font-weight="700" class="green">cliente_id</text><text x="820" y="252" font-size="12" font-weight="700" class="green">documento_id</text><text x="967" y="252" font-size="12" font-weight="700" class="green">Drive ↗</text><text x="552" y="290" font-size="13" font-weight="400" class="">FAC-0042</text><text x="686" y="290" font-size="13" font-weight="400" class="">CLI-0001</text><text x="820" y="290" font-size="13" font-weight="400" class="">DOC-0088</text><text x="967" y="290" font-size="13" font-weight="400" class="">Abrir ↗</text><text x="552" y="328" font-size="13" font-weight="400" class="">FAC-0043</text><text x="686" y="328" font-size="13" font-weight="400" class="">CLI-0002</text><text x="820" y="328" font-size="13" font-weight="400" class="">DOC-0089</text><text x="967" y="328" font-size="13" font-weight="400" class="">Abrir ↗</text><text x="546" y="377" font-size="12" font-weight="400" class="muted">Columnas protegidas · IDs independientes de la fila</text><rect x="524" y="425" width="568" height="238" rx="14" fill="#ffffff" stroke="#dae5de"/><text x="546" y="461" font-size="20" font-weight="700" class="">La relación que lo une todo</text><text x="546" y="498" font-size="16" font-weight="650" class="green">CLI-0001 → FAC-0042</text><text x="546" y="519" font-size="12" font-weight="400" class="muted">Cliente → factura</text><text x="546" y="553" font-size="16" font-weight="650" class="green">FAC-0042 → DOC-0088</text><text x="546" y="574" font-size="12" font-weight="400" class="muted">Factura → archivo original en Drive</text><text x="546" y="608" font-size="16" font-weight="650" class="green">CLI-0001 → acceso directo a DOC-0088</text><text x="546" y="629" font-size="12" font-weight="400" class="muted">Sin duplicar el original</text><text x="32" y="704" font-size="13" font-weight="400" class="muted">Ejemplo ilustrativo, no captura real. Conectores, OCR y sincronización aún pendientes.</text></svg>