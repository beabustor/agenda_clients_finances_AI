<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="title"><title id="title">Cita en Google Calendar vinculada a agenda y contabilidad, diseño previsto</title><rect width="1120" height="420" rx="24" fill="#0d1117"/><g font-family="system-ui,sans-serif" fill="#e6edf3"><text x="30" y="45" font-size="25" font-weight="700">Una cita. Toda su actividad relacionada.</text><text x="30" y="75" font-size="14" fill="#a4b1bd">Diseño previsto · sincronización Google pendiente · datos ficticios</text><rect x="30" y="110" width="320" height="245" rx="16" fill="#161b22" stroke="#8cdbb5"/><text x="52" y="150" font-size="19" font-weight="700">Google Calendar</text><text x="52" y="190" font-size="16">Cita #24 · 10:00–10:45</text><text x="52" y="225" font-size="15">Evento privado del usuario</text><text x="52" y="265" font-size="15" fill="#8cdbb5">Abrir ficha de la cita →</text><text x="52" y="316" font-size="12" fill="#a4b1bd">Sin comentarios fiscales en el evento</text><text x="369" y="240" font-size="32" fill="#8cdbb5">↔</text><rect x="420" y="110" width="320" height="245" rx="16" fill="#161b22" stroke="#8cdbb5"/><text x="442" y="150" font-size="19" font-weight="700">Ficha privada · CITA-0024</text><text x="442" y="190" font-size="15">Cliente CLI-0001 · servicio SRV-03</text><text x="442" y="225" font-size="15">Material utilizado + comentarios</text><text x="442" y="260" font-size="15">Factura y documentos enlazados</text><text x="442" y="316" font-size="12" fill="#a4b1bd">Acceso autenticado pendiente</text><text x="755" y="240" font-size="32" fill="#8cdbb5">↔</text><rect x="805" y="110" width="285" height="245" rx="16" fill="#161b22" stroke="#8cdbb5"/><text x="827" y="150" font-size="19" font-weight="700">Drive + contabilidad</text><text x="827" y="190" font-size="15">Factura FAC-0042</text><text x="827" y="225" font-size="15">Original DOC-0088 en Drive</text><text x="827" y="260" font-size="15">Cobro vinculado a la cita</text><text x="827" y="316" font-size="12" fill="#a4b1bd">Libro filtrable por cliente y cita</text><text x="30" y="392" font-size="13" fill="#a4b1bd">La cita no genera un ingreso automáticamente. Revisión y confirmación antes de contabilizar.</text></g></svg>