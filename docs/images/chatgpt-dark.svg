<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc"><title id="title">ChatGPT con el usuario</title><desc id="desc">Ejemplo conceptual con datos ficticios. Integraciones pendientes.</desc><rect width="1120" height="740" rx="24" fill="#0d1117"/><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#e6edf3}.muted{fill:#a4b1bd}.green{fill:#8cdbb5}</style><text x="32" y="38" font-size="12" font-weight="750" class="green">MI OFICINA / ASÍ FUNCIONARÁ</text><rect x="874" y="18" width="210" height="29" rx="14" fill="#203b32" stroke="#203b32"/><text x="886" y="38" font-size="11" font-weight="650" class="green">DISEÑO PREVISTO · NO CONECTADO</text><text x="32" y="88" font-size="28" font-weight="750" class="">De una conversación a una oficina organizada.</text><text x="32" y="118" font-size="15" font-weight="400" class="muted">ChatGPT → herramientas autenticadas</text><rect x="28" y="146" width="492" height="517" rx="14" fill="#161b22" stroke="#303d49"/><text x="50" y="184" font-size="19" font-weight="700" class="">ChatGPT · herramienta Mi oficina</text><rect x="90" y="206" width="408" height="88" rx="14" fill="#203b32" stroke="#303d49"/><text x="108" y="229" font-size="11" font-weight="700" class="green">USUARIO</text><text x="108" y="253" font-size="15" font-weight="400" class="">Adjunto la factura de material.</text><text x="108" y="277" font-size="15" font-weight="400" class="">Regístrala como gasto.</text><rect x="48" y="312" width="432" height="112" rx="14" fill="#161b22" stroke="#303d49"/><text x="66" y="335" font-size="11" font-weight="700" class="green">ASISTENTE · PROPUESTA</text><text x="66" y="359" font-size="15" font-weight="400" class="">Base: 45,00 € · IVA: 9,45 €</text><text x="66" y="383" font-size="15" font-weight="400" class="">Total: 54,45 € · revisión fiscal pendiente.</text><text x="66" y="407" font-size="15" font-weight="400" class="">¿Confirmas guardar este borrador?</text><rect x="220" y="445" width="278" height="64" rx="14" fill="#203b32" stroke="#303d49"/><text x="238" y="468" font-size="11" font-weight="700" class="green">USUARIO</text><text x="238" y="492" font-size="15" font-weight="400" class="">Sí, guardar el borrador.</text><rect x="48" y="530" width="432" height="88" rx="14" fill="#161b22" stroke="#303d49"/><text x="66" y="553" font-size="11" font-weight="700" class="green">RESULTADO DE LA HERRAMIENTA</text><text x="66" y="577" font-size="15" font-weight="400" class="">Borrador GAS-0012 guardado.</text><text x="66" y="601" font-size="15" font-weight="400" class="">Documento DOC-0088 vinculado.</text><text x="548" y="393" font-size="34" font-weight="700" class="green">→</text><rect x="596" y="146" width="496" height="517" rx="14" fill="#161b22" stroke="#303d49"/><text x="618" y="184" font-size="20" font-weight="700" class="">Así se transforma la entrada</text><rect x="618" y="221" width="42" height="37" rx="9" fill="#203b32" stroke="#203b32"/><text x="627" y="246" font-size="15" font-weight="700" class="green">01</text><text x="675" y="235" font-size="16" font-weight="700" class="">Extraer y validar</text><text x="675" y="259" font-size="12" font-weight="400" class="muted">Datos legibles; sin inventar campos</text><rect x="618" y="306" width="42" height="37" rx="9" fill="#203b32" stroke="#203b32"/><text x="627" y="331" font-size="15" font-weight="700" class="green">02</text><text x="675" y="320" font-size="16" font-weight="700" class="">Confirmar la propuesta</text><text x="675" y="344" font-size="12" font-weight="400" class="muted">El usuario aprueba antes de escribir</text><rect x="618" y="391" width="42" height="37" rx="9" fill="#203b32" stroke="#203b32"/><text x="627" y="416" font-size="15" font-weight="700" class="green">03</text><text x="675" y="405" font-size="16" font-weight="700" class="">Guardar y relacionar</text><text x="675" y="429" font-size="12" font-weight="400" class="muted">GAS-0012 ↔ DOC-0088 ↔ Drive</text><rect x="618" y="476" width="42" height="37" rx="9" fill="#203b32" stroke="#203b32"/><text x="627" y="501" font-size="15" font-weight="700" class="green">04</text><text x="675" y="490" font-size="16" font-weight="700" class="">Actualizar el libro</text><text x="675" y="514" font-size="12" font-weight="400" class="muted">Fila filtrable · documento enlazado</text><rect x="618" y="561" width="42" height="37" rx="9" fill="#203b32" stroke="#203b32"/><text x="627" y="586" font-size="15" font-weight="700" class="green">05</text><text x="675" y="575" font-size="16" font-weight="700" class="">Avisar y resumir</text><text x="675" y="599" font-size="12" font-weight="400" class="muted">Mismo hilo + copia opcional + conteo diario</text><text x="32" y="704" font-size="13" font-weight="400" class="muted">Ejemplo ilustrativo, no captura real. Conectores, OCR y sincronización aún pendientes.</text></svg>